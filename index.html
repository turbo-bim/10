<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uide Fast Food — Меню</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffc107;
            --dark: #121212;
            --card-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-gray: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--text-light);
            padding-bottom: 90px;
        }

        header {
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            padding: 15px;
            border-bottom: 3px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        header h1 {
            color: var(--primary);
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .lang-btn {
            background: var(--card-bg);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .info-block {
            font-size: 11px;
            color: var(--text-gray);
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 10px;
            border-radius: 8px;
            line-height: 1.4;
        }

        .info-block span {
            color: var(--text-light);
            font-weight: 600;
        }

        .info-block a {
            color: var(--primary);
            text-decoration: none;
        }

        .search-box {
            padding: 10px 15px;
            background: var(--dark);
            position: sticky;
            top: 135px;
            z-index: 99;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #333;
            background: var(--card-bg);
            color: white;
            font-size: 14px;
            outline: none;
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 15px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--card-bg);
            color: var(--text-light);
            border: 1px solid #333;
            padding: 8px 14px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .cat-btn.active {
            background: var(--primary);
            color: var(--dark);
            border-color: var(--primary);
        }

        .container {
            padding: 10px 15px;
        }

        .section-title {
            color: var(--primary);
            font-size: 18px;
            font-weight: 700;
            margin: 20px 0 10px 0;
            text-transform: uppercase;
            border-left: 4px solid var(--primary);
            padding-left: 8px;
        }

        .menu-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #2a2a2a;
        }

        .item-img {
            width: 65px;
            height: 65px;
            border-radius: 8px;
            object-fit: cover;
            background: #2a2a2a;
            flex-shrink: 0;
            display: block;
        }

        .item-info {
            flex-grow: 1;
        }

        .item-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .item-price {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
        }

        .add-btn {
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1a1a1a;
            border-top: 2px solid var(--primary);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .cart-info {
            font-size: 14px;
            font-weight: 600;
        }

        .cart-btn {
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-height: 80vh;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 20px;
            cursor: pointer;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 8px;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: #333;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .checkout-btn {
            width: 100%;
            background: #25D366;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>

            <button class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">KZ / RU</button>
        </div>
        <div class="info-block" id="infoBlock">
            📍 Адрес: с. Караул, ул. Ералы 22Б[cite: 6]<br>

            🚀 Информация: <span id="deliveryText">Доставка есть</span>[cite: 6]

    <div class="search-box">

    <div class="categories" id="categoriesContainer"></div>

    <div class="container" id="menuContainer"></div>

    <div class="cart-bar" id="cartBar" style="display: none;">

    <div class="modal" id="cartModal">

            <div class="modal-header">

                <button class="close-modal" onclick="closeCart()">✕</button>

            <div id="cartItemsList"></div>

            <button class="checkout-btn" id="checkoutBtnText" onclick="sendToWhatsApp()">Отправить заказ в WhatsApp</button>
        </div>
    </div>
